options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

zone "lab.test" {
    type primary;
    file "/etc/bind/zones/lab.test.zone";
    dnssec-policy default;
    inline-signing yes;
};

zone "bogus.lab.test" {
    type primary;
    file "/etc/bind/zones/bogus.lab.test.zone";
    dnssec-policy default;
    inline-signing yes;
};
