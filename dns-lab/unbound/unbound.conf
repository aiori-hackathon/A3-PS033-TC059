server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    username: ""
    chroot: ""
    directory: "/opt/unbound/etc/unbound"
    access-control: 0.0.0.0/0 allow
    local-zone: "test." nodefault
    private-domain: "lab.test"
    trust-anchor-file: "/opt/unbound/etc/unbound/lab.test.key"
    val-log-level: 2

forward-zone:
    name: "lab.test."
    forward-addr: 172.28.0.10
